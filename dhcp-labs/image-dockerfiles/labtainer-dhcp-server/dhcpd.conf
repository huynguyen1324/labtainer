# /etc/dhcp/dhcpd.conf
# Cau hinh ISC DHCP Server cho topo Relay (Dual-Subnet)
# Subnet 1: INTERNAL_NET (192.168.0.0/24) - noi DHCP Server va Relay noi bo
# Subnet 2: EXTERNAL_NET (10.10.0.0/24) - noi Client va Attacker

default-lease-time 600;
max-lease-time 7200;
authoritative;
log-facility local7;

# Subnet noi bo (DHCP Server nam o day, khong cap phat pool dong)
subnet 192.168.0.0 netmask 255.255.255.0 {
    # Khong khai bao range dong cho subnet nay vi chi co Server va Relay
}

# Subnet External (cap phat cho Client thong qua DHCP Relay chuyen tiep toi)
subnet 10.10.0.0 netmask 255.255.255.0 {
    # Pool cap phat dong cho Client trong mang External (10.10.0.100 den 10.10.0.130)
    # Khong trung voi IP tinh ha tang (Relay .1, Attacker .20, Client init .50)
    range 10.10.0.100 10.10.0.130;
    option routers 10.10.0.1;
    option subnet-mask 255.255.255.0;
    option domain-name-servers 192.168.0.100;
    option domain-name "dhcp-relay.lab";
}
